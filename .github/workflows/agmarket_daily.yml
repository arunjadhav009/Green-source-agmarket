name: Agmarket All India Daily Posts (FB + Insta)

# रोज संध्याकाळी 7:15 (IST) = 13:45 UTC. सर्व राज्यांच्या पोस्ट्स 5-5 मिनिटांनी.
# Schedule तेव्हाच चालतो जेव्हा repo Variable  LIVE = true  असेल.
on:
  schedule:
    - cron: '45 13 * * *'
  workflow_dispatch:
    inputs:
      post:
        description: 'FB/Insta वर खरंच पोस्ट करायचं? (no = फक्त images बनवून तपासा)'
        type: choice
        options: ['no', 'yes']
        default: 'no'
      only_states:
        description: 'फक्त ही राज्ये (उदा. Maharashtra,Gujarat). रिकामं = सर्व'
        required: false
        default: ''

concurrency:
  group: agmarket-daily
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || vars.LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.post != 'yes' }}
      ONLY_STATES: ${{ inputs.only_states }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -q playwright requests
          playwright install --with-deps chromium

      - name: Install Fonts
        run: |
          mkdir -p ~/.local/share/fonts
          for f in poppins/Poppins-ExtraBold.ttf poppins/Poppins-Bold.ttf poppins/Poppins-SemiBold.ttf mukta/Mukta-ExtraBold.ttf mukta/Mukta-Bold.ttf mukta/Mukta-SemiBold.ttf; do
            curl -sSfL -o ~/.local/share/fonts/$(basename $f) "https://raw.githubusercontent.com/google/fonts/main/ofl/$f" || echo "font download failed: $f"
          done
          sudo apt-get install -y fonts-noto-core fonts-noto-color-emoji > /dev/null || true
          fc-cache -f

      - name: सर्व राज्यांचा डेटा → images → FB + Insta पोस्ट
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python run_all.py

      - name: Images (तपासण्यासाठी, 3 दिवस राहतील)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agmarket-images
          path: all_images/
          retention-days: 3
          if-no-files-found: ignore

      - name: रोजचा डेटा repo मध्ये सेव्ह करणे
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          # फक्त शेवटच्या 3 दिवसांच्या CSV ठेवायच्या, जुन्या काढून टाकायच्या
          ls data/agmarket/*.csv 2>/dev/null | sort | head -n -3 | xargs -r git rm -q --
          git diff --cached --quiet && exit 0
          git commit -m "Agmarket data $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
