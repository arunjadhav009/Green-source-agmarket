<script>
window.__fit = async()=>{
 await document.fonts.ready;
 const problems=[];
 for(const el of document.querySelectorAll('.text')){
   const span=el.firstElementChild;
   let size=parseFloat(getComputedStyle(el).fontSize);
   const min=Number(el.dataset.min||22);
   const fits=()=>span.scrollWidth<=el.clientWidth+1 && span.getBoundingClientRect().height<=el.clientHeight+1;
   while(!fits() && size>min){size--;el.style.fontSize=size+'px'}
   if(!fits())problems.push(el.id);
 }
 return {fontLoaded:document.fonts.check('35px Noto'),problems,
   sizes:Object.fromEntries([...document.querySelectorAll('.text')].map(e=>[e.id,getComputedStyle(e).fontSize]))};
};
</script></html>
